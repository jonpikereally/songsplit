# Publishes a GitHub release. This is the CI equivalent of scripts/release.sh:
# build SongSplit.app on a macOS runner, zip it, and attach the zip to a
# release named after the tag. The app's in-app update checker looks for
# exactly this: a release tagged vX.Y.Z with a .zip asset.
#
# To ship a version, set VERSION to X.Y.Z on main and then either:
#   - press "Run workflow" on this workflow (it tags vX.Y.Z from VERSION itself),
#   - push tag vX.Y.Z, or
#   - publish a release named vX.Y.Z on the GitHub website (creating the tag
#     there also triggers this workflow, which then attaches the app to it).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed (goes at the top of the release notes)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the build number (commit count) is right

      - name: Fetch tag annotations
        run: git fetch --force --tags origin

      - name: Create tag from VERSION (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "Tag v$V already exists. Bump VERSION on main before releasing again."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "SongSplit $V" -m "${NOTES_INPUT:-See the commit history for what changed.}"
          git push origin "v$V"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - name: Use pushed tag
        if: github.event_name != 'workflow_dispatch'
        run: echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Check tag matches VERSION
        run: |
          WANT="${TAG#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [ "$WANT" != "$FILE" ]; then
            echo "Tag $TAG does not match VERSION file ($FILE)."
            exit 1
          fi
          echo "VERSION=$WANT" >> "$GITHUB_ENV"

      - name: Build app
        run: scripts/build_app.sh build

      - name: Zip app
        run: ditto -c -k --keepParent build/SongSplit.app "build/SongSplit-$VERSION.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WHAT="$(git tag -l --format='%(contents:body)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d')"
          [ -n "$(printf '%s' "$WHAT" | tr -d '[:space:]')" ] || WHAT="See the commit history for what changed."
          NOTES="$WHAT

          **Install:** unzip, drag SongSplit.app to Applications. The app isn't notarized, so the first time, right-click it and choose Open. If you already have SongSplit, choose **Check for Updates…** in the app and it installs itself.
          **Requires:** ffmpeg on your PATH (\`brew install ffmpeg\`). Song identification installs its own helper on first run.
          **Build:** $(git rev-list --count HEAD) ($(git rev-parse --short HEAD)), $(date -u +'%Y-%m-%d %H:%M UTC')"
          ZIP="build/SongSplit-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release was created first (e.g. on the GitHub website): attach the app to it.
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "SongSplit $VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "$ZIP" --title "SongSplit $VERSION" --notes "$NOTES"
          fi
          echo "Released $TAG"
