# Builds SongSplit.app on a macOS runner so every push and pull request
# proves that src/main.swift compiles (pushes to main/staging, every PR). The built app is attached to the run
# as a downloadable artifact.
name: Build app

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build SongSplit.app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the build number (commit count) is right

      - name: Check every error has a code
        run: python3 scripts/check_error_codes.py

      - name: Check macOS reads SongSplit's tags
        run: |
          # A WAV whose ONLY metadata is the ID3 chunk SongSplit writes, so a
          # pass proves Mac apps (and DJ software built on Apple's frameworks)
          # read it, not some other tag.
          python3 - <<'PY'
          import sys, wave
          sys.path.insert(0, ".")
          from songsplit import add_id3
          with wave.open("tagtest.wav", "wb") as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100)
              w.writeframes(b"\0" * 44100 * 4)
          add_id3("tagtest.wav", {"title": "Déjà Vu", "artist": "Beyoncé feat. Jay-Z",
                                  "album": "B'Day", "date": "2006", "genre": "R&B"})
          PY
          swift scripts/check_tags_macos.swift tagtest.wav "Déjà Vu" "Beyoncé feat. Jay-Z"

      - name: Show toolchain
        run: |
          sw_vers
          swiftc --version

      - name: Build app
        run: scripts/build_app.sh build

      - name: Sanity-check bundle
        run: |
          BIN=build/SongSplit.app/Contents/MacOS/SongSplit
          test -x "$BIN"
          /usr/libexec/PlistBuddy -c "Print" build/SongSplit.app/Contents/Info.plist
          lipo -archs "$BIN"
          test -s build/SongSplit.app/Contents/Resources/AppIcon.icns
          # The binary's minimum macOS must match Info.plist, or older Macs refuse to launch it.
          WANT="$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" src/Info.plist)"
          for ARCH in arm64 x86_64; do
            GOT="$(otool -arch "$ARCH" -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
            echo "$ARCH minos=$GOT (want $WANT)"
            [ "$GOT" = "$WANT" ] || { echo "Minimum macOS mismatch for $ARCH"; exit 1; }
          done

      - name: Zip app
        run: ditto -c -k --keepParent build/SongSplit.app build/SongSplit.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SongSplit-${{ github.sha }}
          path: build/SongSplit.zip
          if-no-files-found: error
